[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-bio"
version = "0.1.0"
description = "Official Python client and CLI for UbuntuBio - African Bioinformatics Data Hub"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "UbuntuBio Community", email = "dev@ubuntubio.org" }
]
keywords = [
    "bioinformatics",
    "africa",
    "genomics",
    "datasets",
    "open-science",
    "openxet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27.2",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20240917",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20240917",
]


[project.scripts]
ubio = "ubuntu_bio.cli:main"
ubuntu-bio = "ubuntu_bio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_bio", "src/ubuntubio"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101", # Allow assert in tests
    "S105", # Possible hardcoded password
    "S106", # Possible hardcoded password
    "S603", # Subprocess calls
    "S607", # Partial executable paths
    "B008", # Function call in argument defaults
    "S324", # MD5 used for remote_files.tsv checksums
    "SIM117", # Allow nested with statements in tests
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
